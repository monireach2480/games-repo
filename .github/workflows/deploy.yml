#deploy.yml
name: Build and Deploy Games to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pygbag
        run: pip install pygbag

      - name: Build all games
        run: |
          set -e
          mkdir -p site
          for game in maze-runner space-shooter cowboy drone-hunter; do
            echo "==> Building $game"
            cd "$game"
            python -m pygbag --build --ume_block 0 --disable-sound-format-error .
            cd ..
            mkdir -p "site/$game"
            cp -r "$game/build/web/." "site/$game/"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
